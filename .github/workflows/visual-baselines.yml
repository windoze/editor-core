name: Visual Baselines

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Visual baseline mode.
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - strict
  pull_request:

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-baselines:
    name: Visual baseline smoke/strict
    runs-on: macos-15
    env:
      ATTO_VISUAL_ARTIFACT_DIR: ${{ github.workspace }}/target/atto-visual-artifacts
      ATTO_VISUAL_RENDER_BACKEND: appkit-skia-metal
      ATTO_VISUAL_SCALE_FACTOR: "1.0"
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          rustc --version
          cargo --version

      - name: Record visual environment
        run: swift/scripts/write-visual-ci-environment.sh

      - name: Detect checked-in visual baseline PNGs
        id: checked_in_baselines
        shell: bash
        run: |
          baseline_png="$(find swift/Tests/AttoEditorTests/Resources/VisualBaselines -type f -name '*.png' -print -quit)"
          if [[ -n "$baseline_png" ]]; then
            echo "has_png=true" >> "$GITHUB_OUTPUT"
            echo "Found checked-in visual baseline PNG: $baseline_png"
          else
            echo "has_png=false" >> "$GITHUB_OUTPUT"
            echo "No checked-in visual baseline PNGs found; pull requests run smoke capture only."
          fi

      - name: Smoke visual baseline manifest
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke') || (github.event_name == 'pull_request' && steps.checked_in_baselines.outputs.has_png != 'true') }}
        run: swift test --package-path swift --filter 'AttoEditorVisualBaselineManifestTests'

      - name: Strict visual baseline comparison
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'strict') || (github.event_name == 'pull_request' && steps.checked_in_baselines.outputs.has_png == 'true') }}
        run: swift/scripts/check-visual-baselines.sh

      - name: Upload visual artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: atto-visual-artifacts
          path: target/atto-visual-artifacts
          if-no-files-found: ignore
