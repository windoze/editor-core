[package]
name = "editor-core-app"
version.workspace = true
description = "UI-agnostic editor application shell primitives built on editor-core."
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["editor", "workspace", "tabs", "search"]
categories = ["text-editors", "text-processing"]

[dependencies]
editor-core = { version = "0.3.0", path = "../editor-core", features = ["serde"] }
editor-core-lang = { version = "0.3.0", path = "../editor-core-lang" }
editor-core-lsp = { version = "0.3.0", path = "../editor-core-lsp" }

ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
