[package]
name = "editor-core-ui"
version.workspace = true
description = "UI composition layer for editor-core (input mapping + rendering)."
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["editor", "ui"]
categories = ["text-editors"]

[dependencies]
editor-core = { version = "0.5.0", path = "../editor-core" }
editor-core-render-skia = { version = "0.5.0", path = "../editor-core-render-skia" }
editor-core-sublime = { version = "0.5.0", path = "../editor-core-sublime" }
editor-core-treesitter = { version = "0.5.0", path = "../editor-core-treesitter" }
editor-core-lsp = { version = "0.5.0", path = "../editor-core-lsp" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1"
softbuffer = "0.4"

[target.'cfg(target_os = "macos")'.dev-dependencies]
winit = "0.29"

[target.'cfg(target_os = "windows")'.dev-dependencies]
winit = "0.29"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Avoid pulling in both Wayland + X11 at once (Wayland often requires system libs in CI).
winit = { version = "0.29", default-features = false, features = ["x11"] }

[[bench]]
name = "ui_pipeline"
harness = false
