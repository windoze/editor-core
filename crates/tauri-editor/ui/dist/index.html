<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tauri-editor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="editorRoot">
      <div id="scrollViewport">
        <div id="spacerTop"></div>
        <div id="rowsLayer"></div>
        <div id="spacerBottom"></div>
      </div>

      <div id="overlayLayer">
        <div id="selections"></div>
        <div id="cursor"></div>
      </div>

      <div id="sidebar">
        <div id="minimap">
          <canvas id="minimapCanvas"></canvas>
          <div id="minimapViewport"></div>
        </div>
        <div id="scrollbar">
          <div id="scrollbarThumb"></div>
        </div>
      </div>

      <textarea id="imeInput" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
