[package]
name = "editor-core-treesitter"
version.workspace = true
description = "Tree-sitter integration for editor-core (highlighting, folding, incremental parsing)."
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["editor", "text-editor", "unicode", "tree-sitter", "headless"]
categories = ["text-editors", "text-processing"]
readme = "README.md"

[dependencies]
editor-core = { version = "0.5.0", path = "../editor-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
tree-sitter = { version = "0.26", features = ["wasm"] }

[dev-dependencies]
tempfile = "3"
